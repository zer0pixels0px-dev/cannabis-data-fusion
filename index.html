<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloomberg du cannabis — Fusion v2</title>
<style>
:root { --bg:#0b1020; --panel:#141b33; --line:#243055; --txt:#e8ecf8; --mut:#8b94b3; --cy:#22d3ee; --vi:#a78bfa; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; min-height:100vh; }
header { padding:28px 20px 18px; text-align:center; border-bottom:1px solid var(--line); background:linear-gradient(180deg,#101736,transparent); }
header h1 { font-size:1.7rem; letter-spacing:.5px; }
header h1 .cy { color:var(--cy); } header h1 .vi { color:var(--vi); }
header p { color:var(--mut); margin-top:6px; font-size:.92rem; }
.bar { max-width:900px; margin:18px auto; padding:0 16px; display:flex; gap:10px; flex-wrap:wrap; }
.bar input[type=search] { flex:1; min-width:200px; padding:12px 16px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--txt); font-size:1rem; }
.bar select { padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--txt); }
main { max-width:900px; margin:0 auto; padding:0 16px 60px; }
#count { color:var(--mut); font-size:.85rem; margin:6px 2px 12px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; cursor:pointer; transition:border-color .15s; }
.card:hover { border-color:var(--cy); }
.card h3 { font-size:1.05rem; } .card h3 .pop { color:#fbbf24; font-size:.85rem; margin-left:6px; }
.card .meta { color:var(--mut); font-size:.85rem; margin-top:4px; }
.badge { display:inline-block; font-size:.72rem; padding:2px 8px; border-radius:20px; border:1px solid var(--vi); color:var(--vi); margin-right:6px; }
#more { display:block; margin:18px auto; padding:12px 28px; border-radius:10px; border:1px solid var(--cy); background:transparent; color:var(--cy); font-size:1rem; cursor:pointer; }
#detail { position:fixed; inset:0; background:rgba(4,7,18,.85); display:none; overflow-y:auto; padding:24px 14px; z-index:10; }
#detail.open { display:block; }
.sheet { max-width:760px; margin:0 auto; background:var(--panel); border:1px solid var(--cy); border-radius:16px; padding:24px; }
.sheet h2 { margin-bottom:4px; } .sheet .sub { color:var(--mut); margin-bottom:14px; font-size:.9rem; }
.sheet h4 { color:var(--cy); margin:16px 0 6px; font-size:.85rem; text-transform:uppercase; letter-spacing:.6px; }
.sheet p, .sheet li { font-size:.92rem; line-height:1.5; } .sheet ul { padding-left:18px; }
.sheet .close { float:right; background:none; border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:6px 12px; cursor:pointer; }
.kv { display:grid; grid-template-columns:150px 1fr; gap:4px 10px; font-size:.9rem; }
.kv dt { color:var(--mut); } .kv dd { word-break:break-word; }
.warn { background:#2a1f0d; border:1px solid #b45309; border-radius:8px; padding:10px 12px; font-size:.85rem; margin-top:12px; }
footer { text-align:center; color:var(--mut); font-size:.8rem; padding:24px; border-top:1px solid var(--line); }
#loading { text-align:center; color:var(--mut); padding:40px; }
</style>
</head>
<body>
<header>
<h1><span class="cy">Bloomberg</span> du <span class="vi">cannabis</span></h1>
<p>Fusion v2 — 44 105 cultivars · données brutes multi-sources · jamais inventé</p>
</header>
<div class="bar">
<input type="search" id="q" placeholder="Rechercher un cultivar… (ex. Blue Dream)" autocomplete="off">
<select id="ftype"><option value="">Tous types</option></select>
<label style="align-self:center;color:var(--mut);font-size:.9rem"><input type="checkbox" id="fpop"> Populaires</label>
</div>
<main>
<div id="count"></div>
<div id="loading">Chargement de l'index…</div>
<div id="list"></div>
<button id="more" style="display:none">Afficher plus</button>
</main>
<div id="detail"><div class="sheet"><button class="close" onclick="closeDetail()">Fermer ✕</button><div id="sheetBody"></div></div></div>
<footer>Données : SeedFinder, CSV 8910, Leafly, breeders — compilation v2 · Conflits exposés, jamais tranchés</footer>
<script src="app.js"></script>
</body>
</html>
